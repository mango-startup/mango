# Ambiente local: API + Postgres. Uso: docker compose -f docker-compose.dev.yml up --build
# Credenciais abaixo são só de desenvolvimento local.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://mango:mango@db:5432/mango
      STORAGE_DIR: /dados/fotos
      # Área de admin local: usuários raziel e lucas com esta senha inicial (a troca é obrigatória no primeiro login).
      ADMIN_SENHA_INICIAL: mango-dev-2026
      # Pagamento (opcional, só para testar o Stripe em modo teste). Exporte no seu terminal antes de subir; nunca grave a chave aqui:
      #   STRIPE_SECRET_KEY=sk_test_... STRIPE_WEBHOOK_SECRET=whsec_... APP_URL=http://localhost:5173 docker compose -f docker-compose.dev.yml up
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_URL: ${APP_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - fotos:/dados/fotos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  fotos:

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: /camera e /galeria recarregados direto devem cair no index.html
    location / {
        try_files $uri /index.html;
    }

    # arquivos com hash do Vite podem ser cacheados por muito tempo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
